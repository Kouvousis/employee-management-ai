services:
  db:
    image: pgvector/pgvector:pg18
    # Credentials come from server/.env: POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
    # (Applied only when the volume is first created — `docker compose down -v` to reset.)
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    # All backend config — including DATABASE_URL — comes from server/.env.
    # To use the bundled `db` service, DATABASE_URL's host must be `db`
    # (see server/.env.example). Point it elsewhere to use your own PostgreSQL.
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./client
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data: